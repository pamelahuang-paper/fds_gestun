name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      # Training needs no BigQuery -- it reads the committed training set.
      # If this fails, the model can't be rebuilt and the job would break at 03:00.
      - run: fds-gestun train --eval
